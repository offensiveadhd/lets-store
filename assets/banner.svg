<linearGradient id="sb-wm" gradientUnits="userSpaceOnUse" x1="0" y1="29" x2="0" y2="167"><stop offset="0" stop-color="#f8f4ff"/><stop offset="1" stop-color="#cdbbff"/></linearGradient>
<filter id="sb-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sb-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
