<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="sh-t sh-d">
<title id="sh-t">How a unique reaches the store and your machine</title>
<desc id="sh-d">Three boxes in a row: an author's repo that holds a unique (unique.json, GUIDE.md, ui/), the lets-store repo with its index.json, and your machine. A pull request carries one entry from the author to index.json, with a pinned sha and verified false. CI runs node scripts/validate.mjs and passes. A maintainer reviews the manifest and the entry's verified field turns true. On your machine, /lets store with the unique's name searches the index; you inspect and confirm. After your yes a dot runs along a dotted line from the author's repo to your machine: the engine clones the repo and installs it in ~/.lets/uniques, in a folder with the unique's name.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#ece6ff}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:28px;font-weight:700;text-anchor:middle}
.s{font-size:20px;fill:#a99cd0;text-anchor:middle}
.k{font-size:20px;fill:#a99cd0;text-anchor:middle}
.c{font-size:20px;text-anchor:middle}
.b{fill:#1a1030;fill-opacity:.9;stroke:#5a44a0;stroke-width:2.5}
.dm{fill:#a99cd0}.pl{fill:#ece6ff}.cy{fill:#6bf0ff}.mg{fill:#ff6bd6}.gr{fill:#5ef2a6}
</style>
<defs>
<radialGradient id="sh-bg" cx="70%" cy="28%" r="95%"><stop offset="0" stop-color="#2b1a52"/><stop offset="1" stop-color="#120b1f"/></radialGradient>
<radialGradient id="sh-g1" cx="96%" cy="100%" r="46%"><stop offset="0" stop-color="#6bf0ff" stop-opacity=".12"/><stop offset="1" stop-color="#6bf0ff" stop-opacity="0"/></radialGradient>
<radialGradient id="sh-g2" cx="2%" cy="0%" r="46%"><stop offset="0" stop-color="#ff6bd6" stop-opacity=".1"/><stop offset="1" stop-color="#ff6bd6" stop-opacity="0"/></radialGradient>
<radialGradient id="sh-orb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#e3ccff"/><stop offset=".45" stop-color="#a66bff"/><stop offset="1" stop-color="#5a2fb0"/></radialGradient>
</defs>
<rect x="1" y="1" width="1278" height="418" rx="24" fill="url(#sh-bg)"/>
<rect x="1" y="1" width="1278" height="418" rx="24" fill="url(#sh-g1)"/>
<rect x="1" y="1" width="1278" height="418" rx="24" fill="url(#sh-g2)" stroke="#5a44a0" stroke-opacity=".7" stroke-width="2"/>
<path d="M310 131H460M820 131H970" stroke="#5a44a0" stroke-width="2.5"/><path d="M175 232V240Q175 254 189 254H1091Q1105 254 1105 240" fill="none" stroke="#a66bff" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/><path d="M1105 233l-7.5 13h15z" fill="#a66bff" fill-opacity=".8"/><text class="k" x="385" y="108">pull request</text><text class="k" x="895" y="108">search</text><text class="k" x="640" y="286">the engine clones the repo and installs it in <tspan class="m pl">~/.lets/uniques/&lt;name&gt;</tspan></text>
<rect class="b" x="40" y="34" width="270" height="198" rx="16"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#6bf0ff;#6bf0ff;#5a44a0;#5a44a0;#a66bff;#a66bff;#5a44a0;#5a44a0;#6bf0ff;#6bf0ff" keyTimes="0;.125;.1417;.75;.7583;.8583;.8708;.9792;.9958;1"/></rect><text class="t" x="175" y="78">Author's repo</text><text class="s" x="175" y="110">one unique, static files:</text><text class="c m" x="175" y="146">unique.json</text><text class="c m" x="175" y="174">GUIDE.md</text><text class="c m" x="175" y="202">ui/</text>
<rect class="b" x="460" y="34" width="360" height="198" rx="16"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#5a44a0;#5a44a0;#6bf0ff;#6bf0ff;#5a44a0;#5a44a0;#5ef2a6;#5ef2a6;#5a44a0;#5a44a0" keyTimes="0;.125;.1333;.1733;.1833;.4583;.4667;.5233;.5333;1"/></rect><text class="t" x="640" y="74">lets-store</text><text class="dm" x="764" y="74" font-size="20" text-anchor="end">CI</text><circle cx="787" cy="67" r="11.5" fill="none" stroke="#a99cd0" stroke-width="2.5"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#a99cd0;#a99cd0;#a66bff;#a66bff;#5ef2a6;#5ef2a6;#a99cd0;#a99cd0" keyTimes="0;.1917;.2042;.2667;.275;.9667;.9833;1"/></circle><g opacity="0"><path d="M781 67.5l4.5 4.5l8 -9.5" fill="none" stroke="#5ef2a6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.2667;.2833;.9667;.9833;1"/></g><rect x="478" y="92" width="324" height="128" rx="10" fill="#120b1f" stroke="#3a2a63" stroke-width="2"/><text class="m dm" x="494" y="117" font-size="20">index.json</text><path d="M478 127H802" stroke="#3a2a63" stroke-width="2"/><g opacity="1"><text class="m dm" x="494" y="153" font-size="20">"uniques": [ … ]</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.125;.1417;.9792;.9958;1"/></g><g opacity="0"><text class="m" x="494" y="153" font-size="20">"name": "&lt;name&gt;"</text><text class="m" x="494" y="181" font-size="20">"sha": "&lt;commit&gt;"</text><text class="m" x="494" y="209" font-size="20" opacity="1">"verified": <tspan class="dm">false</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.4583;.4708;.9833;.9917;1"/></text><text class="m" x="494" y="209" font-size="20" opacity="0">"verified": <tspan class="gr" font-weight="700">true</tspan><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.4708;.4833;.9833;.9917;1"/></text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1333;.1542;.9583;.9792;1"/></g>
<rect class="b" x="970" y="34" width="270" height="198" rx="16"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#5a44a0;#5a44a0;#6bf0ff;#6bf0ff;#5a44a0;#5a44a0;#5ef2a6;#5ef2a6;#5a44a0;#5a44a0" keyTimes="0;.5583;.5667;.6067;.6167;.8667;.875;.9567;.9667;1"/></rect><text class="t" x="1105" y="78">Your machine</text><text class="c m dm" x="1105" y="114">/lets store &lt;name&gt;</text><g opacity="0"><text class="c m cy" x="1105" y="114">/lets store &lt;name&gt;</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.5583;.575;.95;.9667;1"/></g><text class="k" x="1105" y="146">inspect, then confirm</text><g opacity="0"><text class="c cy" x="1105" y="146">inspect, then confirm</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7083;.725;.95;.9667;1"/></g><path d="M990 166H1220" stroke="#3a2a63" stroke-width="2"/><text class="k" x="1105" y="206" opacity="1">not installed yet<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.8667;.8833;.9667;.9833;1"/></text><g opacity="0"><path d="M1050 199l6 6l10 -12" fill="none" stroke="#5ef2a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="gr" x="1078" y="206" font-size="20" font-weight="600">installed</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8667;.8833;.9667;.9833;1"/></g>
<g opacity="1" transform="translate(310 131)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="310 131;310 131;460 131;460 131;310 131;310 131" keyTimes="0;.05;.125;.1417;.1433;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1292;.1375;.975;.9833;1"/></g><g opacity="0" transform="translate(970 131)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="970 131;970 131;820 131;820 131;970 131;970 131" keyTimes="0;.5833;.6375;.6542;.6558;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.575;.5833;.6417;.65;1"/></g><g opacity="0" transform="translate(820 131)"><circle r="17" fill="#a66bff" fill-opacity=".2"/><circle r="8.5" fill="#a66bff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="820 131;820 131;970 131;970 131;820 131;820 131" keyTimes="0;.6458;.7;.7167;.7183;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6375;.6458;.7042;.7125;1"/></g><g opacity="0"><circle r="17" fill="#a66bff" fill-opacity=".2"/><circle r="8.5" fill="#a66bff"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M175 232V240Q175 254 189 254H1091Q1105 254 1105 240V234" keyPoints="0;0;1;1" keyTimes="0;.7667;.8667;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7583;.7667;.8708;.8792;1"/></g>
<g opacity="1"><text x="40" y="340" font-size="22">A pull request adds one entry to <tspan class="m">index.json</tspan>: where the unique's repo is, ideally with a pinned <tspan class="m">sha</tspan>.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.1667;.1833;.9833;1"/></g>
<g opacity="0"><text x="40" y="340" font-size="22">CI runs <tspan class="m">node scripts/validate.mjs</tspan> on every push and pull request.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1917;.2083;.35;.3667;1"/></g>
<g opacity="0"><text x="40" y="340" font-size="22">The entry lands unverified. A maintainer re-checks the manifest and flips <tspan class="m">verified</tspan> to <tspan class="m">true</tspan>.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.375;.3917;.5333;.55;1"/></g>
<g opacity="0"><text x="40" y="340" font-size="22">You run <tspan class="m">/lets store &lt;name&gt;</tspan>, inspect the manifest and its permissions, and say yes.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.5583;.575;.725;.7417;1"/></g>
<g opacity="0"><text x="40" y="340" font-size="22">Only after your yes is the unique installed, at the pinned commit when the entry has one.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.75;.7667;.9583;.975;1"/></g>
<text class="dm" x="40" y="394" font-size="20">verified is a review mark, not a cryptographic guarantee. A pinned sha freezes what was reviewed.</text>
</svg>
